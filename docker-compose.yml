# version: "3"
#
# Postgres・商品画像フォルダはこのcompose管理の外(サーバーに直接インストール/配置した
# ネイティブな環境)で動かす前提。backendもsystemdで常駐させるネイティブプロセスなので
# ここには含めない(backend/deploy/blm-backend.serviceを参照)。
# Dockerで動くのはfrontendとnginxだけ。
services:

  frontend:
    # container_name: blm-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # backendはコンテナではなくホスト上でuvicornが常駐しているため、
      # コンテナからホストへ抜けるための特別なDNS名host.docker.internalで参照する
      BACKEND_INTERNAL_URL: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:3000"  #"3000:3000"
    restart: always

  nginx:
    image: nginx:alpine
    # container_name: blm-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # サーバー上の商品画像フォルダ(NAS_MEDIA_PATH)を読み取り専用でバインドし、直接静的配信する
      - ${NAS_MEDIA_PATH:-./data/media}:/usr/share/nginx/media:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - frontend
    restart: always
