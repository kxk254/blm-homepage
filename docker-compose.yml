# version: "3"
#
# Postgresはこのcompose managementの外(開発機・本番サーバーそれぞれに直接インストールした
# ネイティブなPostgres)で動かす前提。backend/.envのDATABASE_URLで接続先を指定する。
services:

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    volumes:
      # ホストOS側で事前にNASの共有フォルダをマウントしておいたパスを指定する。
      # 未設定時は./data/media(ローカル動作確認用)にフォールバックする
      - ${NAS_MEDIA_PATH:-./data/media}:/mnt/media
    restart: always

  frontend:
    # container_name: blm-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "8080:3000"  #"3000:3000"
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    # container_name: blm-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # nginxからはアップロード済み画像を直接静的配信するだけなので読み取り専用でよい
      - ${NAS_MEDIA_PATH:-./data/media}:/usr/share/nginx/media:ro
    depends_on:
      - frontend
      - backend
    restart: always
