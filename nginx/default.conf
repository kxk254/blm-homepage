server {
    listen 80;
    server_name localhost;

    # 商品画像はサーバーのローカルディスク上のフォルダを直接静的配信する(Pythonプロセスを経由させない方が速い)
    location /media/ {
        alias /usr/share/nginx/media/;
        add_header Cache-Control "public, max-age=3600";
    }

    # 認証・DB・決済など、アプリのAPIはすべてFastAPIへ
    # backendはDockerコンテナではなくホスト上でuvicornが常駐しているので、
    # host.docker.internal(ホストへ抜けるための特別なDNS名)経由で参照する
    location /api/ {
        proxy_pass http://host.docker.internal:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Set-CookieをNext.js経由ではなくブラウザへ直接返す場合もあるため素通しする
        proxy_pass_header Set-Cookie;
    }

    # それ以外は画面表示のNext.jsへ
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
